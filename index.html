<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>3dbus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <bus-3d></bus-3d>
    <header>
      <nav id="models" aria-label="Choose bus"></nav>
      <div class="row">
        <h1 id="title"></h1>
        <span id="json" role="group" aria-label="Input JSON">
          <span>{ }</span>
          <a id="src" target="_blank" rel="noopener">Original</a>
          <a id="mod">Modified</a>
        </span>
      </div>
      <p><span id="sub"></span></p>
    </header>
    <main id="cards" hidden></main>
    <button id="toggle" aria-expanded="false" aria-controls="info">Details</button>
    <aside id="info"></aside>
    <nav id="views" aria-label="Camera views"></nav>
    <pre id="err"></pre>
    <dialog id="drift" aria-labelledby="drift-text">
      <p id="drift-text">The model has been edited and no longer matches this source file.</p>
      <form method="dialog">
        <button value="abort">Abort</button>
        <button value="ok">OK</button>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
